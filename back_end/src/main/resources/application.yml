server:
  port: 8080

spring:
  application:
    name: smartbarber

  # configurazione database POSTGRESQL
  datasource:
    url: jdbc:postgresql://localhost:5432/smartbarber_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  # configurazione HIBERNATE/JPA
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # configurazione sicurezza keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/smartbarber
          jwk-set-uri: http://localhost:8081/realms/smartbarber/protocol/openid-connect/certs