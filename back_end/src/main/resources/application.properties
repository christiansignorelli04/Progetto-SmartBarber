spring.application.name=smartbarber
spring.datasource.url=jdbc:postgresql://localhost:5432/smartbarber_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/smartbarber
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/smartbarber/protocol/openid-connect/certs